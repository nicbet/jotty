[package]
name = "jotty"
version = "0.0.2"
edition = "2024"
rust-version = "1.88"
description = "Jot down thoughts scoped to a project, without leaving any files behind in it"
license = "MIT"
repository = "https://github.com/nicbet/jotty"
readme = "README.md"
keywords = ["notes", "jot", "tui", "cli", "markdown"]
categories = ["command-line-utilities"]
exclude = [".github/", "demo/"]

[dependencies]
ansi-to-tui = "7"
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = "0.28"
ratatui = "0.29"
termimad = "0.35.5"
tui-textarea = "0.7.0"
